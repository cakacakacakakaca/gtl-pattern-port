plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'dev.gtlpatternport'
version = '1.0.2'
base { archivesName = 'gtl-pattern-port-1.20.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.1.47' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(JavaExec).configureEach { systemProperty 'file.encoding', 'UTF-8' }
jar.finalizedBy('reobfJar')
tasks.register('codecTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.gtlpatternport.CodecTest'
    jvmArgs '-ea'
    if (project.hasProperty('fixturePath')) args project.property('fixturePath')
}
check.dependsOn codecTest
tasks.register('instanceProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.gtlpatternport.InstanceProbe'
    args project.findProperty('instancePath') ?: '.'
}
tasks.register('instanceTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.gtlpatternport.InstanceTest'
    args project.findProperty('instancePath') ?: '.'
}

tasks.register('fileProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.gtlpatternport.FileProbe'
    if (project.hasProperty('patternFile')) args project.property('patternFile')
}
